<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Rounded square background -->
  <rect x="8" y="8" width="184" height="184" rx="36" ry="36" fill="#FFFFFF" stroke="#2454A6" stroke-width="8"/>

  <!-- Devanagari अ -->
  <text x="52" y="122" font-family="Noto Sans Devanagari, Arial, sans-serif" font-size="72" font-weight="700" fill="#000000" text-anchor="middle">अ</text>

  <!-- Two-sided arrow -->
  <g stroke="#000000" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="85" y1="100" x2="118" y2="100"/>
    <polyline points="93,92 85,100 93,108"/>
    <polyline points="110,92 118,100 110,108"/>
  </g>

  <!-- Preeti-style C -->
  <text x="150" y="122" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#000000" text-anchor="middle">C</text>
</svg>
